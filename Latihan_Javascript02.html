<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        #inputTugas {
            padding: 5px;
            width: 200px;
            font-size: 14px;
        }

        #btnTambah {
            padding: 5px 15px;
            font-size: 14px;
            cursor: pointer;
        }

        ul {
            list-style-type: disc;   
            padding-left: 20px;      
        }

        li {
            font-size: 16px;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="input-group">
        <input type="text" id="inputTugas" placeholder="Tulis tugas...">
        <button id="btnTambah" onclick="tambahTugas()">Tambah</button>
    </div>

    <ul id="daftarTugas">
    </ul>

    <script>
        function tambahTugas() {
            const input = document.getElementById('inputTugas');
            const tugas = input.value.trim();

            if (tugas === '') {
                alert('Tugas tidak boleh kosong!');
                return;
            }

            const ul = document.getElementById('daftarTugas');
            const li = document.createElement('li');
            li.textContent = tugas; 
            ul.appendChild(li);

            input.value = '';
            input.focus();
        }

        document.getElementById('inputTugas').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                tambahTugas();
            }
        });
    </script>

</body>
</html>
