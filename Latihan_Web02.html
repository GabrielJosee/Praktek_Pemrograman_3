<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Web 02</title>
</head>
<style>

    body{
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .form-group {
        display: grid;
        grid-template-columns: 15px, 20px, auto 1fr;
        align-items: center;
        margin-bottom: 10px;
    }

    .form-group label {
        width: 100px;
        text-align: left;
    }

    .form-group.align-top {
        align-items: flex-start;
    }

    input[type="text"], input[type="email"], textarea, input[type="number"] {
        width: 400px;
        padding: 5px;
        box-sizing: border-box;
    }

    input[type="submit"] {
        padding: 15px 25px;
        background-color: #4CAF50;
        color: white;
        border-radius: 20px;
        cursor: pointer;
        margin-left: 150px; 
        margin-top: 20px;
    }
</style>

<body>
    <form action="/submit" method="post">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group align-top">
            <label for="address">Address:</label>
            <textarea name="address" id="address" rows="4" required></textarea>
        </div>
        <div class="form-group">
            <label for="postcode">Postcode:</label>
            <input type="number" id="postcode" name="postcode"
                oninput="if (this.value.length > 5) this.value = this.value.slice(0, 5);" required>
        </div>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
